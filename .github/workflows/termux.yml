name: Termux (Android arm64)

# Repackages the glibc aarch64 build so it runs unmodified on Termux/Android.
#
# Android is bionic libc; Termux exports LD_LIBRARY_PATH=$PREFIX/lib (which
# holds a musl-built libgcc_s.so.1) and LD_PRELOAD=libresolvefix.so. Both make
# a plain glibc binary die with "libc.musl-aarch64.so.1: cannot open shared
# object file" (upstream issue #193). Two ELF edits fix it for good:
#   --set-interpreter -> $PREFIX/glibc/lib/ld-linux-aarch64.so.1
#   --force-rpath     -> $PREFIX/glibc/lib
# RPATH (not RUNPATH) is required: it is searched before LD_LIBRARY_PATH.
#
# V8 has no musl prebuilt for aarch64, so a fully static build is not possible;
# Termux users must `pkg install glibc-repo glibc`.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  termux:
    name: Termux aarch64
    # aarch64 runner so the smoke test can execute what it built.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev patchelf

      - name: Build stealth release binaries
        run: cargo build --profile release-dist -p obscura-cli --bins --features render,stealth

      - name: Patch ELF for Termux
        run: |
          PREFIX=/data/data/com.termux/files/usr
          BIN_DIR=target/aarch64-unknown-linux-gnu/release-dist
          mkdir -p dist
          cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/
          for BIN in dist/obscura dist/obscura-worker; do
            patchelf --set-interpreter "$PREFIX/glibc/lib/ld-linux-aarch64.so.1" \
                     --force-rpath --set-rpath "$PREFIX/glibc/lib" "$BIN"
          done

      - name: Smoke test
        run: |
          ./dist/obscura fetch "data:text/html,<title>ok</title>" --eval "1+1"
          ./dist/obscura fetch "data:text/html,<style>body{margin:0;background:%23123456}</style>" --screenshot smoke.png
          test -s smoke.png

      - name: Package
        run: tar czf obscura-aarch64-termux.tar.gz -C dist obscura obscura-worker

      - uses: actions/upload-artifact@v4
        with:
          name: obscura-aarch64-termux
          path: obscura-aarch64-termux.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" obscura-aarch64-termux.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
