name: Termux (Android arm64)

# Builds Obscura for Android/Termux and publishes a release.
#   - tag push (v*)      -> release named after the tag
#   - manual dispatch    -> rolling "termux-latest" release, overwritten each run
#
# Android uses bionic libc. Termux exports LD_LIBRARY_PATH=$PREFIX/lib (holds a
# musl-built libgcc_s.so.1) and LD_PRELOAD=libresolvefix.so, so a plain glibc
# binary dies with "libc.musl-aarch64.so.1: cannot open shared object file"
# (upstream issue #193). Two ELF edits fix it for good:
#   --set-interpreter -> $PREFIX/glibc/lib/ld-linux-aarch64.so.1
#   --force-rpath     -> $PREFIX/glibc/lib
# RPATH (not RUNPATH) is required: RPATH is searched before LD_LIBRARY_PATH.
#
# V8 has no musl aarch64 prebuilt, so a static build is impossible and users
# must `pkg install glibc-repo glibc`.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: termux-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    # aarch64 runner so the smoke test can execute what it built.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev patchelf

      - name: Build
        run: cargo build --profile release-dist -p obscura-cli --bins --features render,stealth

      - name: Smoke test (unpatched, runs natively on this runner)
        run: |
          BIN=target/release-dist/obscura
          "$BIN" fetch "data:text/html,<title>ok</title>" --eval "1+1"
          "$BIN" fetch "data:text/html,<style>body{margin:0;background:%23123456}</style>" --screenshot smoke.png
          test -s smoke.png

      - name: Patch ELF for Termux
        run: |
          PREFIX=/data/data/com.termux/files/usr
          mkdir -p dist
          cp target/release-dist/obscura target/release-dist/obscura-worker dist/
          for BIN in dist/obscura dist/obscura-worker; do
            patchelf --set-interpreter "$PREFIX/glibc/lib/ld-linux-aarch64.so.1" \
                     --force-rpath --set-rpath "$PREFIX/glibc/lib" "$BIN"
          done

      - name: Verify patch
        run: |
          for BIN in dist/obscura dist/obscura-worker; do
            readelf -l "$BIN" | grep -q 'glibc/lib/ld-linux-aarch64.so.1' || { echo "$BIN: interpreter not set" >&2; exit 1; }
            readelf -d "$BIN" | grep -q 'RPATH.*glibc/lib' || { echo "$BIN: RPATH not set" >&2; exit 1; }
            if readelf -d "$BIN" | grep -q RUNPATH; then
              echo "$BIN: RUNPATH present, must be RPATH" >&2
              exit 1
            fi
          done

      - name: Package
        run: tar czf obscura-aarch64-termux.tar.gz -C dist obscura obscura-worker

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          else
            TAG="termux-latest"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                   --title "Termux (Android arm64) — latest" \
                   --notes "Rolling build of the Termux patched binaries. Overwritten on each run."
          fi
          gh release upload "$TAG" obscura-aarch64-termux.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
